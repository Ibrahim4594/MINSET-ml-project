<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time handwritten digit recognition using deep learning">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23667eea' width='100' height='100'/><text x='50%' y='50%' font-size='60' fill='white' text-anchor='middle' dy='.35em' font-weight='bold'>7</text></svg>">
    <title>MNIST Handwritten Digit Recognition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .canvas-container {
            background: #f5f5f5;
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        canvas {
            display: block;
            margin: 0 auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: crosshair;
            touch-action: none;
        }

        .canvas-size-info {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #predictBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #predictBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        #predictBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #clearBtn {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        #clearBtn:hover {
            background: #e0e0e0;
        }

        .drawing-tools {
            margin-bottom: 20px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .tools-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }

        .tool-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .tool-btn {
            flex: 1;
            padding: 8px;
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .tool-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        .brush-size-control {
            margin-top: 10px;
        }

        .brush-size-control label {
            font-size: 12px;
            color: #666;
            display: block;
            margin-bottom: 5px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .options {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .options input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .options label {
            cursor: pointer;
            flex: 1;
            color: #333;
            font-size: 14px;
        }

        .results {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 20px;
            display: none;
        }

        .results.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .predicted-digit {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .confidence-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .confidence-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .status {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 15px;
            min-height: 16px;
        }

        .status.loading {
            color: #667eea;
        }

        .status.error {
            color: #e74c3c;
        }

        .status.success {
            color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Digit Recognition</h1>
        <p class="subtitle">Draw a digit and let AI predict it</p>

        <div class="canvas-container">
            <canvas id="drawingCanvas" width="280" height="280"></canvas>
            <div class="canvas-size-info">Canvas: 280×280 pixels (scaled to 28×28 for model)</div>
        </div>

        <div class="controls">
            <button id="predictBtn">Predict</button>
            <button id="clearBtn">Clear</button>
        </div>

        <div class="drawing-tools">
            <span class="tools-label">Drawing Tools</span>
            <div class="tool-buttons">
                <button class="tool-btn active" id="brushBtn">✏️ Brush</button>
                <button class="tool-btn" id="eraserBtn">🗑️ Eraser</button>
            </div>
            <div class="brush-size-control">
                <label>Brush Size: <span id="brushSizeValue">12</span>px</label>
                <input type="range" id="brushSizeSlider" min="2" max="30" value="12">
            </div>
        </div>

        <div class="options">
            <input type="checkbox" id="realtimeCheckbox">
            <label for="realtimeCheckbox">Real-time prediction</label>
        </div>

        <div class="results" id="results">
            <div class="predicted-digit" id="predictedDigit">?</div>
            <div class="confidence-label">Confidence</div>
            <div class="confidence-bar">
                <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
            </div>
            <div style="font-size: 12px; color: #666; margin-top: 5px;">
                <span id="confidencePercent">0</span>%
            </div>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');

        // UI elements
        const predictBtn = document.getElementById('predictBtn');
        const clearBtn = document.getElementById('clearBtn');
        const brushBtn = document.getElementById('brushBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        const brushSizeSlider = document.getElementById('brushSizeSlider');
        const brushSizeValue = document.getElementById('brushSizeValue');
        const realtimeCheckbox = document.getElementById('realtimeCheckbox');
        const resultsDiv = document.getElementById('results');
        const statusDiv = document.getElementById('status');

        // State
        let drawingMode = 'pen';
        let brushSize = 12;
        let isDrawing = false;

        // Initialize canvas
        function initCanvas() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        initCanvas();

        // Drawing functions
        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function draw(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();

            if (realtimeCheckbox.checked) {
                setTimeout(predictDigit, 500);
            }
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                ctx.closePath();
            }
        }

        // Event listeners
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Tool switching
        brushBtn.addEventListener('click', () => {
            drawingMode = 'pen';
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = 'black';
            brushBtn.classList.add('active');
            eraserBtn.classList.remove('active');
            ctx.lineWidth = brushSize;
        });

        eraserBtn.addEventListener('click', () => {
            drawingMode = 'eraser';
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(0,0,0,1)';
            eraserBtn.classList.add('active');
            brushBtn.classList.remove('active');
            ctx.lineWidth = brushSize;
        });

        // Brush size
        brushSizeSlider.addEventListener('input', (e) => {
            brushSize = parseInt(e.target.value);
            brushSizeValue.textContent = brushSize;
            ctx.lineWidth = brushSize;
        });

        // Buttons
        predictBtn.addEventListener('click', predictDigit);
        clearBtn.addEventListener('click', () => {
            initCanvas();
            resultsDiv.classList.remove('show');
            statusDiv.textContent = '';
        });

        async function predictDigit() {
            try {
                predictBtn.disabled = true;
                statusDiv.className = 'status loading';
                statusDiv.textContent = 'Predicting...';

                const imageData = canvas.toDataURL('image/png');

                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });

                if (!response.ok) throw new Error(`Error: ${response.status}`);

                const result = await response.json();

                if (result.error) throw new Error(result.error);

                // Display results
                document.getElementById('predictedDigit').textContent = result.digit;
                const confidence = Math.round(result.confidence * 100);
                document.getElementById('confidencePercent').textContent = confidence;
                document.getElementById('confidenceFill').style.width = confidence + '%';

                resultsDiv.classList.add('show');
                statusDiv.className = 'status success';
                statusDiv.textContent = '✓ Prediction complete!';

            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `Error: ${error.message}`;
            } finally {
                predictBtn.disabled = false;
            }
        }

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(() => console.log('Service Worker registered'))
                .catch((e) => console.log('SW failed:', e));
        }
    </script>
</body>
</html>
