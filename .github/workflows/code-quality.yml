name: Code Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint flake8 black isort mypy

    - name: Format check with Black
      run: black --check . || true

    - name: Import sort check with isort
      run: isort --check-only . || true

    - name: Lint with pylint
      run: |
        pylint app.py prediction_service.py model_manager.py --exit-zero || true

    - name: Type checking with mypy
      run: |
        mypy app.py --ignore-missing-imports || true

    - name: Security check with bandit
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true

    - name: Lines of code count
      run: |
        find . -name "*.py" -not -path "./test*" | xargs wc -l | tail -1 || true
